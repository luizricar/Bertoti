<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Carros</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Catálogo de Carros</h1>

    <div class="car-form">
      <input type="text" id="modelInput" placeholder="Digite o modelo">
      <button onclick="addCar()">
        <span class="material-icons">add</span>
        Adicionar
      </button>
    </div>

    <ul class="car-list" id="carList">
      <!-- Lista de carros aparece aqui -->
    </ul>
  </div>

  <script>
    const apiUrl = 'http://localhost:8080/cars';

    function loadCars() {
      fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('carList');
          list.innerHTML = '';

          data.forEach(car => {
            const li = document.createElement('li');
            li.className = 'car-item';

            li.innerHTML = `
              <span>${car.model}</span>
              <div class="car-actions">
                <button class="edit" onclick="editCar('${car.id}', '${car.model}')">
                  <span class="material-icons">edit</span>
                  Editar
                </button>
                <button class="delete" onclick="deleteCar('${car.id}')">
                  <span class="material-icons">delete</span>
                  Excluir
                </button>
              </div>
            `;

            list.appendChild(li);
          });
        })
        .catch(error => {
          console.error('Erro ao carregar carros:', error);
          document.getElementById('carList').innerHTML = '<p style="color: var(--color-error);">Erro ao carregar dados. Verifique se a API está em execução.</p>';
        });
    }

    function addCar() {
      const input = document.getElementById('modelInput');
      const model = input.value.trim();

      if (model === '') {
        showNotification('Digite o modelo!', 'error');
        return;
      }

      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao adicionar carro');
        }
        input.value = '';
        showNotification('Carro adicionado com sucesso!', 'success');
        loadCars();
      })
      .catch(error => {
        console.error('Erro:', error);
        showNotification('Erro ao adicionar carro', 'error');
      });
    }

    function editCar(id, currentModel) {
      const newModel = prompt('Editar modelo:', currentModel);
      if (!newModel || newModel.trim() === '') return;

      fetch(`${apiUrl}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: newModel })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao editar carro');
        }
        showNotification('Carro atualizado com sucesso!', 'info');
        loadCars();
      })
      .catch(error => {
        console.error('Erro:', error);
        showNotification('Erro ao editar carro', 'error');
      });
    }

    function deleteCar(id) {
      if (!confirm('Deseja excluir este carro?')) return;

      fetch(`${apiUrl}/${id}`, {
        method: 'DELETE'
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro ao excluir carro');
        }
        showNotification('Carro excluído com sucesso!', 'warning');
        loadCars();
      })
      .catch(error => {
        console.error('Erro:', error);
        showNotification('Erro ao excluir carro', 'error');
      });
    }

    function showNotification(message, type) {
      // Criar elemento de notificação
      const notification = document.createElement('div');
      notification.textContent = message;
      notification.style.position = 'fixed';
      notification.style.bottom = '20px';
      notification.style.right = '20px';
      notification.style.padding = '12px 20px';
      notification.style.borderRadius = '8px';
      notification.style.fontWeight = 'bold';
      notification.style.zIndex = '1000';
      notification.style.animation = 'fadeIn 0.3s, fadeOut 0.3s 2.7s';
      
      // Definir cor com base no tipo
      switch(type) {
        case 'success':
          notification.style.backgroundColor = 'var(--color-success)';
          break;
        case 'error':
          notification.style.backgroundColor = 'var(--color-error)';
          break;
        case 'warning':
          notification.style.backgroundColor = 'var(--color-warning)';
          notification.style.color = '#333';
          break;
        case 'info':
          notification.style.backgroundColor = 'var(--color-info)';
          break;
        default:
          notification.style.backgroundColor = 'var(--color-primary)';
      }
      
      notification.style.color = type === 'warning' ? '#333' : 'white';
      
      // Adicionar ao corpo do documento
      document.body.appendChild(notification);
      
      // Remover após 3 segundos
      setTimeout(() => {
        document.body.removeChild(notification);
      }, 3000);
    }

    // Adicionar estilos para animações de notificação
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(20px); }
      }
    `;
    document.head.appendChild(style);

    window.onload = loadCars;
  </script>
</body>
</html>
